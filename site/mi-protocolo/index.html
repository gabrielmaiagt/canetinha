<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi Protocolo · Dieta del Tipo de Sangre</title>

<link rel="manifest" href='data:application/json,{"name":"Dieta del Tipo de Sangre","short_name":"Mi Protocolo","display":"standalone","background_color":"%23fff5f5","theme_color":"%23b3122e"}'>

<style>
:root{
  --bg:#fff5f5; --bg2:#fde8e8; --card:#fff; --card2:#fffafa;
  --line:rgba(140,20,40,.13); --line2:rgba(140,20,40,.28);
  --ink:#2b1418; --ink2:#6b5257; --mute:#a8949a;
  --accent:#b3122e; --accent-deep:#8a0d22; --accent-soft:#fde2e6;
  --grad:linear-gradient(180deg,#e0435c 0%,#b3122e 100%);
  --red:#dc2626; --red-soft:#fee2e2; --green:#16a34a; --green-deep:#15803d; --green-soft:#dcfce7;
  --amber:#b45309; --amber-soft:#fef3c7;
  --r:20px; --r-sm:14px; --maxw:520px; --tab:72px;
  --font:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 18px 44px -20px rgba(120,15,35,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.app{max-width:var(--maxw);margin:0 auto;padding:0 16px calc(var(--tab) + 26px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px}
.head{max-width:var(--maxw);margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.95rem}
.logo svg{width:20px;height:20px;color:var(--accent)}
.logo b{color:var(--accent)}
.tchip{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-weight:800;font-size:.8rem;cursor:pointer}
.drop{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.72rem;background:var(--tc,var(--accent))}
h1{font-size:1.32rem;font-weight:800;letter-spacing:-.01em;margin:16px 0 0;line-height:1.25}
h1 .hl,h2 .hl{color:var(--accent)}
h2{font-size:1.05rem;font-weight:800;margin:26px 0 0}
h3{font-size:.95rem;font-weight:800;margin:0}
p{margin:8px 0 0;color:var(--ink2)}
.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-deep);border-radius:99px;padding:5px 11px;font-size:.76rem;font-weight:700}
.pill.g{background:var(--green-soft);color:var(--green-deep)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:var(--r);font-weight:800;font-size:1rem;color:#fff;background:var(--grad);cursor:pointer;padding:12px 18px;box-shadow:0 10px 26px -12px rgba(179,18,46,.7);margin-top:14px;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.green{background:linear-gradient(180deg,#22c55e 0%,#15803d 100%);box-shadow:0 10px 26px -12px rgba(22,163,74,.7)}
.btn.ghost{background:none;color:var(--accent-deep);border:1px solid var(--line2);box-shadow:none;min-height:46px;font-size:.92rem}
/* hoje */
.hero{display:flex;align-items:center;gap:14px}
.ring{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%),var(--bg2) 0)}
.ring i{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.95rem;color:var(--accent-deep)}
.hero b{display:block;font-size:1.02rem;font-weight:800}
.hero span{font-size:.85rem;color:var(--ink2)}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);cursor:pointer;margin-top:8px;user-select:none}
.task .ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:800}
.task.on{background:var(--green-soft);border-color:transparent}
.task.on .ck{background:var(--green);border-color:var(--green)}
.task.on .tt{text-decoration:line-through;color:var(--ink2)}
.task .tt{font-weight:600;font-size:.9rem}
.task small{display:block;color:var(--ink2);font-size:.78rem;font-weight:400;text-decoration:none}
/* refeições */
.meal{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.meal:first-child{border-top:0;padding-top:4px}
.meal .ic{width:40px;height:40px;flex:none;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.2rem}
.meal small{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.meal b{display:block;font-size:.92rem;line-height:1.35}
.meal p{font-size:.8rem;margin-top:3px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:12px -16px 0;padding-left:16px;padding-right:16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:52px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;cursor:pointer;font-size:1.05rem;color:var(--ink)}
.day small{font-size:.62rem;font-weight:600;color:var(--mute)}
.day.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.day.sel small{color:#fde2e6}
.day.lock{opacity:.4}
.day.done{border-color:var(--green)}
/* listas */
.seg{display:flex;background:var(--bg2);border-radius:99px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 6px;font-weight:700;font-size:.84rem;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--accent-deep);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grp h3{margin-top:16px;font-size:.86rem;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600}
.chip.ok{background:var(--green-soft);color:var(--green-deep)}
.chip.no{background:var(--red-soft);color:var(--red)}
.chip.mid{background:var(--amber-soft);color:var(--amber)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-top:1px dashed var(--line);font-size:.86rem}
.swap:first-of-type{border-top:0}
.swap .a{color:var(--red);font-weight:600;text-decoration:line-through}
.swap .b{color:var(--green-deep);font-weight:700;text-align:right}
.shop{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer;font-size:.9rem}
.shop:first-child{border-top:0}
.shop .ck{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;color:#fff;font-size:.7rem}
.shop.on{color:var(--mute);text-decoration:line-through}
.shop.on .ck{background:var(--green);border-color:var(--green)}
.shop em{margin-left:auto;font-style:normal;color:var(--mute);font-size:.78rem}
/* receitas */
details{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:10px;overflow:hidden}
summary{list-style:none;padding:14px 16px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.92rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-weight:800;color:var(--accent);font-size:1.2rem}
details[open] summary::after{content:"−"}
summary .e{font-size:1.3rem}
.dbody{padding:0 16px 16px;font-size:.88rem;color:var(--ink2)}
.dbody ol,.dbody ul{padding-left:20px;margin:8px 0 0}
.dbody li{margin-top:4px}
.dbody b{color:var(--ink)}
.dz{display:flex;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.dz:first-child{border-top:0}
.dz .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.dz.on .n{background:var(--green);color:#fff}
/* peso */
.wrow{display:flex;gap:8px;margin-top:12px}
.wrow input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px;font-size:1rem;font-weight:700;background:var(--card);color:var(--ink)}
.wrow .btn{margin:0;width:auto;min-height:48px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:800;color:var(--accent-deep)}
.stat span{font-size:.72rem;color:var(--ink2)}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:14px;padding-top:18px}
.bar{flex:1;background:var(--accent-soft);border-radius:8px 8px 4px 4px;position:relative;min-height:6px}
.bar:last-child{background:var(--accent)}
.bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.66rem;font-weight:700;color:var(--ink2);white-space:nowrap}
/* abas */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:700;color:var(--mute);cursor:pointer}
nav button .i{font-size:1.25rem;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--accent)}
nav button.on .i{filter:none;opacity:1}
/* setup */
.setup{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px 10px;text-align:center;cursor:pointer;font-weight:800}
.opt .drop{width:44px;height:44px;margin:0 auto 6px;font-size:.95rem}
.opt small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.wide{grid-column:span 2}
.al{background:var(--amber-soft);color:#7c2d12;border-radius:var(--r-sm);padding:12px 14px;font-size:.84rem;margin-top:12px}
.al.g{background:var(--green-soft);color:#14532d}
.foot{font-size:.72rem;color:var(--mute);text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:.84rem;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* extras */
.vit{position:relative;background:linear-gradient(160deg,#fff 0%,#fff1f3 100%);border:2px solid var(--accent);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.vit .tag{position:absolute;top:-11px;left:14px;background:var(--accent);color:#fff;font-size:.68rem;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.vit h3{font-size:1.02rem;display:flex;gap:8px;align-items:center}
.vit ul{list-style:none;padding:0;margin:10px 0 0}
.vit li{font-size:.84rem;padding:3px 0 3px 22px;position:relative;color:var(--ink)}
.vit li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:800}
.vit .pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:10px}
.vit .pr s{color:var(--mute);font-size:.85rem}
.vit .pr b{font-size:1.35rem;font-weight:800;color:var(--green-deep)}
.vit .btn{margin-top:10px;min-height:50px;font-size:.95rem}
.vit.mini{padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.vit.mini .e{font-size:1.6rem}
.vit.mini b{display:block;font-size:.9rem}
.vit.mini span{font-size:.78rem;color:var(--ink2)}
.vit.mini .go{margin-left:auto;font-weight:800;color:var(--accent);white-space:nowrap;font-size:.85rem}
.vit.own{border-color:var(--green);background:linear-gradient(160deg,#fff 0%,#f0fdf4 100%)}
.vit.own .go{color:var(--green-deep)}
.lk{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:600;color:var(--ink2);opacity:.8}
.lk .lock{margin-left:auto}
.back{border:0;background:none;color:var(--accent-deep);font-weight:700;padding:14px 0 0;cursor:pointer;font-size:.9rem}
</style>
</head>

  <button class="tchip" id="tchip" type="button"></button>

// liberación de extra: link de agradecimiento (?libera=CODIGO) o código escrito en Más
const liberar = (cod) => {
  const c = String(cod || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const k = Object.keys(EXTRAS).find((k) => EXTRAS[k].codigo === c); if (k) { S.extras[k] = true; save(); return k; }
  const u = Object.keys(UPSELLS).find((u) => UPSELLS[u].codigos[c]); if (!u) return null;
  if (S.ups[u] !== "full") S.ups[u] = UPSELLS[u].codigos[c]; save(); return u;
};
const nomeDe = (k) => (EXTRAS[k] || UPSELLS[k]).nome;

try { const fila = JSON.parse(localStorage.getItem("sangre_lib") || "[]"); if (QS.get("lib")) fila.push(QS.get("lib"));
  fila.forEach((c) => { const k = liberar(c); if (k && !LIBEROU) LIBEROU = k; }); localStorage.removeItem("sangre_lib");
  if (QS.get("lib") && !QS.get("libera")) history.replaceState(null, "", location.pathname); } catch (e) {}
if (LIBEROU) { S.tab = "x_" + LIBEROU; history.replaceState(null, "", location.pathname); }

    <h2>⛔ Cero Absoluto del tipo ${t}</h2><p class="small">En los 21 días, ni un pedacito.</p><div class="card"><div class="chips">${x.zero[t].map((y) => `<span class="chip no">${y}</span>`).join("")}</div></div>
    ${full ? `<h2>🥤 Jugo y té del tipo ${t}</h2>${x.bebidas[t].map(([n, r]) => `<div class="card flat"><h3>${n}</h3><p class="small">${r}</p></div>`).join("")}
      <a class="btn green" ${CONFIG.grupoVip ? `href="${CONFIG.grupoVip}" target="_blank" rel="noopener"` : `href="#" data-off`}>Entrar al grupo del Reto 21 Días</a>` : ""}`;
};
TABS.x_intest = () => {
  const x = UPSELLS.intest, t = S.tipo, full = S.ups.intest === "full", g = x.ingredientes[t];
  return `${voltar}<h1>${x.emoji} Intestino · <span class="hl">tipo ${t}</span></h1><p class="small">${x.intro}</p>
    <h2>🕐 El orden correcto</h2><div class="card">${x.ordem[t].map(([h, r]) => `<div class="meal"><span class="ic">⏰</span><div><small>${h}</small><b>${r}</b></div></div>`).join("")}</div>
    <h2>🧺 Ingredientes de limpieza del tipo ${t}</h2><div class="card"><h3 style="font-size:.86rem">Usar</h3><div class="chips">${g.usar.map((y) => `<span class="chip ok">${y}</span>`).join("")}</div>
      <h3 style="font-size:.86rem;margin-top:14px">Evitar, aunque sea "natural"</h3><div class="chips">${g.evitar.map((y) => `<span class="chip no">${y}</span>`).join("")}</div></div>
    <h2>✅ Paso a paso de los 7 días</h2><div class="card">${x.passos.map(([d, tx], i) => `<div class="dz it7 ${S.intest[i] ? "on" : ""}" data-z="${i}"><span class="n">${S.intest[i] ? "✓" : i + 1}</span><div><b>${d}</b><br><span class="small">${tx}</span>${full ? `<br><span class="small" style="color:var(--accent-deep)">🍽️ ${x.menu[t][i]}</span>` : ""}</div></div>`).join("")}</div>
    ${full ? `<h2>📈 Qué esperar</h2><div class="card">${ul(x.esperar)}</div>` : ""}`;
};
TABS.x_familia = () => {
  const x = UPSELLS.familia, full = S.ups.familia === "full", max = full ? 3 : 1, d = diaAtual();
  const todos = [{ nome: "Tú", tipo: S.tipo, peso: S.peso }, ...S.perfis];
  const card = (p, i) => { const c = comPerfil(p, () => cardapio(d)), T = TIPOS[p.tipo];
    return `<div class="card"><div style="display:flex;align-items:center;gap:10px">${drop(p.tipo)}<div><b>${esc(p.nome)}</b><br><span class="small">Tipo ${p.tipo} · ${T.nome}${p.provavel ? " · perfil probable" : ""} · ${String(p.peso).replace(".", ",")} kg</span></div></div>
      <div class="chips" style="margin-top:10px">${Object.values(T.rejeita).flat().slice(0, 5).map((y) => `<span class="chip no">${y}</span>`).join("")}</div>
      <h3 style="margin-top:12px;font-size:.86rem">Hoy (día ${d})</h3>${refeicoes(c)}
      <button class="btn ghost" data-rm="${i}" type="button" style="color:var(--red)">Quitar perfil</button></div>`; };
  const quem = {}; todos.forEach((p) => Object.entries(TIPOS[p.tipo].aceita).forEach(([gr, arr]) => { if (/Bebidas|Grasas/.test(gr)) return; arr.forEach((it) => { const n = it.replace(/ \(.*\)/, ""); (quem[n] = quem[n] || new Set()).add(p.nome); }); }));
  const rej = (n) => todos.filter((p) => Object.values(TIPOS[p.tipo].rejeita).flat().some((r) => r.toLowerCase().includes(n.toLowerCase().split(" ")[0]))).map((p) => p.nome);
  const comuns = Object.keys(quem).filter((n) => quem[n].size === todos.length && !rej(n).length);
  const lista = Object.keys(quem).sort((a, b) => quem[b].size - quem[a].size);
  return `${voltar}<h1>${x.emoji} Protocolo de la Familia</h1><p class="small">${x.intro} Tienes <b>${max} perfil${max > 1 ? "es" : ""}</b> extra${max > 1 ? "s" : ""}.</p>
    ${S.perfis.map((p, i) => card(p, i)).join("")}
    ${S.perfis.length < max ? `<h2>➕ Agregar persona (${S.perfis.length}/${max})</h2><div class="card">
      <div class="wrow"><input id="fnome" placeholder="Nombre (ej: Carlos)"></div>
      <div class="wrow"><select id="ftipo" style="flex:1;border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px;font-size:1rem;background:var(--card);color:var(--ink);font-family:inherit"><option value="">Tipo de sangre</option><option>O</option><option>A</option><option>B</option><option>AB</option><option value="?">No sé el tipo</option></select><input id="fpeso" type="number" inputmode="decimal" placeholder="Peso (kg)"></div>
      <div id="fq" hidden class="small" style="margin-top:10px"><b>Test rápido del perfil probable:</b>
        <label style="display:block;margin-top:6px"><input type="checkbox" id="fq1"> El pan y la pasta le hinchan</label>
        <label style="display:block;margin-top:6px"><input type="checkbox" id="fq2"> La carne roja le cae pesada</label>
        <label style="display:block;margin-top:6px"><input type="checkbox" id="fq3"> La leche y el queso le caen bien</label></div>
      <button class="btn" id="fadd" type="button">Agregar</button></div>` : ""}
    ${full && S.perfis.length ? `<h2>🍲 Menú de la casa</h2><div class="card small"><p style="margin:0"><b>Base que sirve para todos:</b> ${comuns.slice(0, 8).join(", ") || "arma con la proteína de cada uno y la verdura en común"}.</p>
      <p><b>En el plato de cada uno:</b></p>${ul(todos.map((p) => `<b>${esc(p.nome)}</b> (tipo ${p.tipo}): evita ${Object.values(TIPOS[p.tipo].rejeita).flat().slice(0, 4).join(", ").toLowerCase()}`))}</div>
      <h2>🔁 Cambios rápidos</h2>${x.trocas.map(([n, r]) => `<div class="card flat"><h3>${n}</h3><p class="small">${r}</p></div>`).join("")}` : ""}
    ${S.perfis.length ? `<h2>🛒 Lista de compras de la casa</h2><div class="card">${lista.map((n) => `<div class="shop ${S.compras["f:" + n] ? "on" : ""}" data-x="f:${esc(n)}"><span class="ck">${S.compras["f:" + n] ? "✓" : ""}</span>${esc(n)}<em>${[...quem[n]].map(esc).join(", ")}</em></div>`).join("")}</div>` : ""}`;
};

function refeicoes(c) {
  return [["☕", "Desayuno", c.cafe], ["🍽️", "Almuerzo", c.almoco], ["🍎", "Merienda", c.lanche], ["🌙", "Cena", c.jantar]].map(([i, l, t]) => `<div class="meal"><span class="ic">${i}</span><div><small>${l}</small><b>${esc(t)}</b></div></div>`).join("");
}
function compras() {
  const t = T(), q = porc(), out = [];
  const qtd = { "Proteínas": `${(q.p * 10 / 1000).toFixed(1).replace(".", ",")} kg en la semana`, "Lácteos": "1 a 2 envases", "Verduras": "1 atado / 3 unid.", "Frutas": "5 a 7 unid.", "Carbohidratos": "1 kg", "Grasas y condimentos": "", "Grasas y bebidas": "", "Bebidas": "" };
  Object.entries(t.aceita).forEach(([g, arr]) => arr.forEach((x) => { if (!/Agua|Café solo|poco\)$|poca\)$/.test(x) || g === "Carbohidratos") out.push([x.replace(/ \(.*\)/, ""), x === arr[0] && g === "Proteínas" ? qtd[g] : (qtd[g] && g !== "Proteínas" ? qtd[g] : "")]); }));
  out.push(["Piña, jengibre, hierbabuena y limón", "Agua Desinflama"]);
  return out;
}
/* =====================================================================
   RENDER
   ===================================================================== */
function render() {
  if (!S.tipo || !S.peso || !S.inicio) return setup();
  $("#hd").hidden = false; $("#nav").hidden = false;
  $("#tchip").innerHTML = `${drop(S.tipo)}Tipo ${S.tipo}`;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === S.tab));
  $("#app").innerHTML = TABS[S.tab]();
  bind();
}
function bind() {
  document.querySelectorAll(".task").forEach((e) => e.onclick = () => { const d = diaAtual(); S.feitos[d] = S.feitos[d] || {}; S.feitos[d][e.dataset.k] = !S.feitos[d][e.dataset.k]; save(); render(); if (METAS.every((m) => S.feitos[d][m[0]])) toast("¡Día completo! 🎉"); });
  document.querySelectorAll(".day").forEach((e) => e.onclick = () => { TABS._dia = +e.dataset.d; render(); });
  const sel = document.querySelector(".day.sel"); if (sel) sel.scrollIntoView({ inline: "center", block: "nearest" });
  document.querySelectorAll(".seg button").forEach((e) => e.onclick = () => { TABS._lista = e.dataset.l; render(); });
  document.querySelectorAll(".shop").forEach((e) => e.onclick = () => { S.compras[e.dataset.x] = !S.compras[e.dataset.x]; save(); render(); });
  document.querySelectorAll(".dz").forEach((e) => e.onclick = () => { S.desincha[e.dataset.z] = !S.desincha[e.dataset.z]; save(); const open = [...document.querySelectorAll("details")].map((d) => d.open); render(); document.querySelectorAll("details").forEach((d, i) => d.open = open[i]); });
  const lim = $("#limpar"); if (lim) lim.onclick = () => { S.compras = {}; save(); render(); };
  const ap = $("#addp"); if (ap) ap.onclick = () => { const v = parseFloat(String($("#npeso").value).replace(",", ".")); if (!(v >= 35 && v <= 250)) return toast("Escribe el peso en kg"); S.pesos = S.pesos.filter((x) => x.d !== hoje()); S.pesos.push({ d: hoje(), kg: v }); S.peso = v; save(); render(); toast("Peso guardado"); };
  const tr = $("#trocar"); if (tr) tr.onclick = () => { const t = S.tipo; S.tipo = ""; setup(); S.tipo = t; };
  const zr = $("#zerar"); if (zr) zr.onclick = () => { if (zr.dataset.ok) { S.inicio = hoje(); S.feitos = {}; S.desincha = {}; S.pesos = [{ d: hoje(), kg: S.peso }]; save(); S.tab = "hoje"; render(); toast("Reiniciaste desde el día 1"); } else { zr.dataset.ok = 1; zr.textContent = "Toca de nuevo para confirmar"; } };
  document.querySelectorAll("[data-off]").forEach((a) => a.onclick = (e) => { e.preventDefault(); toast("Link aún no configurado"); });
  document.querySelectorAll(".buy").forEach((e) => e.onclick = () => { const u = buyUrl(e.dataset.x); if (!u) return toast("Checkout aún no configurado"); location.href = u; });
  document.querySelectorAll("[data-open]").forEach((e) => e.onclick = () => { const k = e.dataset.open; if (S.extras[k]) { S.tab = "x_" + k; save(); render(); scrollTo(0, 0); } else abrirVenda(k); });
  document.querySelectorAll("[data-venda]").forEach((e) => e.onclick = () => abrirVenda(e.dataset.venda));
  document.querySelectorAll("[data-voltar]").forEach((e) => e.onclick = () => { S.tab = "mais"; save(); render(); scrollTo(0, 0); });
  document.querySelectorAll(".day.f2").forEach((e) => e.onclick = () => { TABS._f2 = +e.dataset.d; render(); });
  document.querySelectorAll(".day.acd").forEach((e) => e.onclick = () => { TABS._ac = +e.dataset.d; render(); });
  document.querySelectorAll("[data-up]").forEach((e) => e.onclick = () => { S.tab = "x_" + e.dataset.up; save(); render(); scrollTo(0, 0); });
  document.querySelectorAll(".bt").forEach((e) => e.onclick = () => { const d = e.dataset.d; S.barriga[d] = S.barriga[d] || {}; S.barriga[d][e.dataset.k] = !S.barriga[d][e.dataset.k]; save(); render(); });
  const bs = $("#bstart"); if (bs) bs.onclick = () => { S.barriga.inicio = hoje(); save(); render(); toast("Empezó el día 1 🔥"); };
  const lc = $("#libcod"); if (lc) lc.onclick = () => { const k = liberar($("#cod").value); if (!k) return toast("Código no encontrado"); toast(nomeDe(k) + " ¡liberado!"); S.tab = "x_" + k; save(); render(); scrollTo(0, 0); };
  document.querySelectorAll(".ac").forEach((e) => e.onclick = () => { const d = e.dataset.d; S.acel[d] = S.acel[d] || {}; S.acel[d][e.dataset.k] = !S.acel[d][e.dataset.k]; save(); render(); });
  const as = $("#astart"); if (as) as.onclick = () => { S.acel.inicio = hoje(); save(); render(); toast("Empezó el Acelerador ⚡"); };
  document.querySelectorAll(".it7").forEach((e) => e.onclick = () => { S.intest[e.dataset.z] = !S.intest[e.dataset.z]; save(); const open = [...document.querySelectorAll("details")].map((d) => d.open); render(); document.querySelectorAll("details").forEach((d, i) => d.open = open[i]); });
  const fa = $("#fadd"); if (fa) fa.onclick = () => {
    const nome = $("#fnome").value.trim(), tipo = $("#ftipo").value, peso = parseFloat(String($("#fpeso").value).replace(",", "."));
    if (!nome) return toast("Escribe el nombre"); if (!tipo) return toast("Elige el tipo"); if (!(peso >= 15 && peso <= 250)) return toast("Escribe el peso en kg");
    const t = tipo === "?" ? provavel() : tipo; S.perfis.push({ nome, tipo: t, peso, provavel: tipo === "?" }); save(); render(); toast(nome + " agregado");
  };
  document.querySelectorAll("[data-rm]").forEach((e) => e.onclick = () => { if (e.dataset.ok) { S.perfis.splice(+e.dataset.rm, 1); save(); render(); } else { e.dataset.ok = 1; e.textContent = "Toca de nuevo para quitar"; } });
  const ft = $("#ftipo"); if (ft) ft.onchange = () => { const q = $("#fq"); if (q) q.hidden = ft.value !== "?"; };
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => { S.tab = b.dataset.t; TABS._dia = 0; save(); render(); scrollTo(0, 0); });
$("#tchip").onclick = () => { S.tab = "listas"; TABS._lista = "aceita"; save(); render(); };
render();
</script>
</body>
</html>
