async function initFirebase() { const v = "10.12.0"; await load(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`); await load(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`); await load(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`); firebase.initializeApp(FIREBASE); db = firebase.firestore(); }
async function fetchAll() {
  const from = F.from || "2020-01-01", to = F.to || dayStr(new Date());
  const snap = await db.collection("sessions").where("day", ">=", from).where("day", "<=", to).limit(8000).get();
  all = snap.docs.map(d => { const x = d.data(); x.createdAt = x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : (x.createdAt || 0); return x; });
  try { const s2 = await db.collection("sales").where("day", ">=", from).where("day", "<=", to).limit(5000).get(); sales = s2.docs.map(d => { const x = d.data(); x.at = x.at && x.at.toMillis ? x.at.toMillis() : (x.at || 0); return x; }); } catch (e) { sales = []; }
  try { const c = await db.collection("config").doc("funnel").get(); if (c.exists) config = { ...config, ...c.data() }; } catch (e) {}
}

/* ============ Cálculos ============ */
function filtered() { return all.filter(s => (!F.from || s.day >= F.from) && (!F.to || s.day <= F.to) && (!F.source || (s.utm_source || "(sem origem)") === F.source) && (!F.entry || s.entry === F.entry) && (!F.vsl || s.vsl === F.vsl)); }
function filteredSales() { return sales.filter(s => (!F.from || s.day >= F.from) && (!F.to || s.day <= F.to) && (!F.source || (s.source || "(sem origem)") === F.source) && (!F.entry || !s.entry || s.entry === F.entry) && (!F.vsl || !s.vsl || s.vsl === F.vsl)); }
const reachedStep = (s, id) => !!(s.steps && s.steps[id]);
function retention(rows) {
  const base = rows.length; const out = [{ id: "pv", label: "PageView · abriu o quiz", n: base, ofStart: 100, ofPrev: 100, drop: 0, media: false }]; let prev = base;
  STEPS.forEach(([id, label]) => {
    if (id === "landing") return;
    const n = id === "checkout" ? rows.filter(s => s.checkoutClicked).length : rows.filter(s => reachedStep(s, id)).length;
    out.push({ id, label, n, ofStart: pct(n, base), ofPrev: pct(n, prev), drop: prev - n, media: MEDIA.has(id) });
    prev = n || prev;
  });
  return out;
}
function dist(rows, key) { const c = {}; let base = 0; rows.forEach(s => { const v = (s.answers || {})[key]; if (v == null) return; base++; (Array.isArray(v) ? v : [v]).forEach(x => { c[x] = c[x] || 0; c[x]++; }); }); return { base, items: Object.entries(c).sort((a, b) => b[1] - a[1]) }; }
function seg(rows, fn, labelOf = (x) => x) { const c = {}; rows.forEach(s => { const k = fn(s); if (k == null) return; c[k] = c[k] || { n: 0, off: 0, ck: 0, done: 0 }; c[k].n++; if (s.offerViewed) c[k].off++; if (s.checkoutClicked) c[k].ck++; if (s.completed) c[k].done++; }); return Object.entries(c).map(([k, v]) => ({ key: k, k: labelOf(k), ...v })).sort((a, b) => b.n - a.n); }

/* ============ Blocos ============ */
function splitCtl(key, what) {
  const v = config.split[key] || 0;
  const opts = [[0, "Desligado · todo mundo vê A"], [10, "Ligado · 10% vê B"], [25, "Ligado · 25% vê B"], [50, "Ligado · 50/50"], [75, "Ligado · 75% vê B"], [100, "Só B · todo mundo vê B"]];
  return `<div class="ctl"><span>Este teste está:</span><select data-split="${key}" ${DEMO ? "disabled" : ""}>${opts.map(([n, l]) => `<option value="${n}" ${n === v ? "selected" : ""}>${l}</option>`).join("")}</select><button class="btn sm" data-reset="${key}" ${DEMO ? "disabled" : ""} title="Quem já entrou continua vendo a mesma variante. Isso sorteia todo mundo de novo.">Reiniciar sorteio</button><span class="sub">${what}${DEMO ? " · desativado no demo" : " · salva na hora"}</span></div>`;
}
function abBlock(title, exp, groups, rowsFn, footNote, ctl = "") {
  // groups: [{k,label,desc,rows:[...sessions],on}]
  const sides = groups.map(g => { const r = rowsFn(g.rows); return `<div class="side ${g.on ? "on" : ""}"><h3>${esc(g.label)}</h3><p class="d">${g.desc}</p>${r.map(x => `<div class="ln"><span>${x[0]}</span><b class="${x[2] || ""}">${x[1]}${x[3] ? `<em>${x[3]}</em>` : ""}</b></div>`).join("")}${g.tot ? `<div class="tot">${g.tot(g.rows)}</div>` : ""}</div>`; }).join("");
  return `<div class="card"><h2>${title}</h2><p class="exp">${exp}</p>${ctl}<div class="duo">${sides}</div>${footNote ? `<p class="foot">${footNote}</p>` : ""}</div>`;
}

    </div>

    <div class="card">
      <h2>Retenção por etapa <span>· por etapa alcançada · 🎧🎬 = mídia · ⏳ = loading</span></h2>
      <div class="vbars">${ret.map((r, i) => `<div class="vb ${r.media ? "vid" : ""} ${i === 0 ? "gray" : ""}"><span class="pv">${P(r.ofStart, 1)}</span><div class="col"><i style="height:${Math.max(2, r.ofStart)}%"></i></div></div>`).join("")}</div>
      <div class="vlabels">${ret.map(r => `<span title="${esc(r.label)}">${esc(r.label)}</span>`).join("")}</div>
      <div class="rows">${ret.map((r, i) => `<div class="row pct"><span class="lbl ${i === 1 && r.ofPrev < 70 ? "hot" : ""}">${esc(r.label)}</span><span class="p ${i && r.ofPrev < 85 ? "hot" : ""}">${i ? P(r.ofPrev) : "100%"}</span>${hbar(r.n, maxN, r.media ? "vid" : i === 0 ? "gray" : "")}<span class="v num"><b>${N(r.n)}</b><span>(${P(r.ofStart)})</span>${i && r.drop > 0 ? `<i>−${N(r.drop)}</i>` : ""}</span></div>`).join("")}</div>
      <p class="foot">Retenção pela etapa alcançada (<code>steps.{id}</code>), na ordem do funil. PageView = toda sessão que abriu o quiz (landing ou 1ª pergunta). % à esquerda = da etapa anterior; entre parênteses = do pageview; vermelho = queda. O drop grande na 2ª linha (Quantos kg) é o bounce na 1ª tela.</p>
    </div>

    <div class="card">
      <h2>Respostas por pergunta</h2>
      <p class="exp">Contagem em <code>answers.*</code>. A pergunta de benefícios é multi, então soma mais de 100%.</p>
      ${QUESTIONS.map(([key, short, full]) => { const d = dist(rows, key); const max = Math.max(1, ...d.items.map(x => x[1])); return `<p class="qtitle">${esc(short)} <span>· ${esc(full)}</span></p><div class="rows">${d.items.map(([v, n]) => `<div class="row"><span class="lbl" title="${esc(String(v))}">${esc(key === "caneta" ? (CANETA[v] || v) : key === "barreira" ? (BARREIRA[v] || v) : key === "compromisso" ? (COMP[v] || v) : String(v))}</span>${hbar(n, max)}<span class="v num"><b>${N(n)}</b><span>${P(pct(n, d.base))}</span></span></div>`).join("") || `<div class="empty">sem respostas</div>`}</div>`; }).join("")}
    </div>

    <div class="card">
      <h2>Personalização <span>· o que o funil calculou e a conversão de cada segmento</span></h2>
      <p class="exp">"ck" = clique no checkout ÷ chegou na oferta, dentro do segmento. É onde aparece se a personalização está pagando.</p>
      ${segList("Faixa de IMC", faixas, "frase do diagnóstico e GIF da oferta")}
      ${segList("Horário da Canetinha", horarios, "rotina + momento da fome")}
      ${segList("Faltam pra meta", faltaB, "peso − ideal · \"até 5 kg\" o Chia mediu 20 pontos abaixo")}
      ${segList("Barreira", barr, "abre a tela \"faltam X kg\"")}
      ${segList("Compromisso", comp, "linha no diagnóstico")}
    </div>


    <div class="card">
      <h2>Leads recentes <span>(${N(pv)} · mostrando ${N(recent.length)})</span></h2>
      <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Quando</th><th>Entrada</th><th>VSL</th><th>Origem</th><th>Áreas</th><th>Corpo</th><th>kg → meta</th><th>Canetinha</th><th>Fome</th><th>IMC</th><th>Etapa atingida</th><th>Checkout</th></tr></thead><tbody>
      ${recent.map(s => `<tr><td class="num">${s.createdAt ? new Date(s.createdAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : s.day}</td><td>${s.entry === "landing" ? "landing" : "pergunta"}</td><td>${esc(s.vsl || "—")}</td><td>${esc(s.utm_source || "—")}</td><td>${esc(((s.answers || {}).areasalvo || []).join(", ") || "—")}</td><td>${esc((s.answers || {}).corpo || "—")}</td><td class="num">${(s.answers || {}).peso ? `${s.answers.peso} → ${s.answers.ideal || "?"}` : "—"}</td><td>${esc(CANETA[(s.answers || {}).caneta] || "—")}</td><td>${esc((s.answers || {}).fome || "—")}</td><td class="num">${s.imc || "—"}</td><td>${esc(stepLabel(s.maxStepId))}</td><td>${s.checkoutClicked ? `<span class="ok">✓ CTA ${s.ctaN || ""}</span>` : s.backCheckout ? `<span class="ok">✓ back</span>` : s.backViewed ? "↩ back" : "—"}</td></tr>`).join("") || `<tr><td colspan="12"><div class="empty">sem sessões no período</div></td></tr>`}
      </tbody></table></div>
    </div>
  </div>`;

  // eventos
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  on("from", "onchange", e => { F.from = e.target.value; refetch(); }); on("to", "onchange", e => { F.to = e.target.value; refetch(); });
  on("fSource", "onchange", e => { F.source = e.target.value; render(); }); on("fEntry", "onchange", e => { F.entry = e.target.value; render(); }); on("fVsl", "onchange", e => { F.vsl = e.target.value; render(); });
  on("clear", "onclick", () => { F = { from: dayStr(d7), to: "", source: "", entry: "", vsl: "" }; refetch(); });
  on("reload", "onclick", refetch);
  on("logout", "onclick", () => firebase.auth().signOut().then(() => location.reload()));
  const saveSplit = async (patch) => { if (DEMO) return; const split = { ...config.split, ...patch }; await db.collection("config").doc("funnel").set({ split }, { merge: true }); config.split = split; render(); };
  document.querySelectorAll("[data-split]").forEach(el => el.onchange = () => saveSplit({ [el.dataset.split]: +el.value }));
  document.querySelectorAll("[data-reset]").forEach(el => el.onclick = () => { if (confirm("Reiniciar o sorteio? Quem já entrou pode cair na outra variante na próxima visita.")) saveSplit({ version: (config.split.version || 1) + 1 }); });
  document.querySelectorAll("[data-tip]").forEach(el => { el.onmousemove = (e) => { tip.textContent = el.dataset.tip; tip.style.display = "block"; tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY + 12) + "px"; }; el.onmouseleave = () => tip.style.display = "none"; });
}
async function refetch() { if (DEMO) { const d = demoData(); all = d.out; sales = d.sl; } else { app.querySelector("h1") && (document.querySelector("#reload").textContent = "…"); await fetchAll(); } render(); }

function loginScreen(err = "") {
  app.innerHTML = `<div class="login"><h1>Canetinha · Leads</h1><p class="sub" style="margin-top:4px">Entre com o e-mail cadastrado no Firebase Auth.</p><input id="em" type="email" placeholder="e-mail" autocomplete="username"><input id="pw" type="password" placeholder="senha" autocomplete="current-password"><button class="btn pri" id="go">Entrar</button>${err ? `<p class="err">${esc(err)}</p>` : ""}<p class="sub" style="margin-top:10px">Ver com dados de exemplo: <a href="?demo=1" style="color:var(--accent)">?demo=1</a></p></div>`;
  document.getElementById("go").onclick = async () => { try { await firebase.auth().signInWithEmailAndPassword(document.getElementById("em").value, document.getElementById("pw").value); } catch (e) { loginScreen(e.message); } };
  document.getElementById("pw").onkeydown = (e) => { if (e.key === "Enter") document.getElementById("go").click(); };
}
(async () => {
  if (DEMO) { const d = demoData(); all = d.out; sales = d.sl; render(); return; }
  app.innerHTML = `<div class="empty" style="margin:60px auto;max-width:400px">Carregando…</div>`;
  await initFirebase();
  firebase.auth().onAuthStateChanged(async (u) => { if (!u) return loginScreen(); app.innerHTML = `<div class="empty" style="margin:60px auto;max-width:400px">Buscando sessões…</div>`; try { await fetchAll(); render(); } catch (e) { app.innerHTML = `<div class="login"><p class="err">Erro ao ler o Firestore: ${esc(e.message)}</p></div>`; } });
})();
</script>
</body>
</html>
